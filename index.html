<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carlos Velasquez — Product Designer</title>
    <meta name="description" content="A playable portfolio. Each world is a case study: the blocks are the copy, the billboards are the work." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Luckiest+Guy&family=Press+Start+2P&family=Inter:wght@400;600;800&family=Young+Serif&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="stage">
      <div id="tv">
        <div id="tv-flip">
          <div id="screen">
            <div id="game"></div>
            <div id="overlay"></div>
            <div id="dev-badge">DEV MODE</div>
            <div id="curtain" aria-hidden="true"></div>
          </div>
          <span class="tv-power"></span>
        </div>
      </div>
      <p id="legend">
        <span><kbd>A</kbd><kbd>W</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
        <span><kbd>K</kbd> / <kbd>Alt</kbd> run</span>
        <span><kbd>L</kbd> / <kbd>Space</kbd> jump</span>
        <span><kbd>S</kbd> pipes</span>
        <span><kbd>Esc</kbd> map</span>
        <span><kbd>M</kbd> mute</span>
        <button id="qv-btn" type="button">Skip the game → read the case studies</button>
      </p>
      <p id="secret">That famous, old cheat code still works. Here is a hint: Starts with Ko and ends with Nami. ;)</p>
    </main>

    <aside id="dev-panel" hidden></aside>
    <div id="quickview" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
